<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><title>wiring</title><rect width="1200" height="660" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="36" y="48" font-size="28" font-weight="700">Final wiring / ESP32-WROOM-32</text><text x="36" y="80" font-size="18">Disconnect USB before changing connections. Perform each test separately.</text><rect x="36" y="115" width="490" height="180" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="56" y="151" font-size="24">UART / Serial2</text><text x="56" y="198" font-size="20">GPIO17 / TX</text><text x="56" y="252" font-size="20">GPIO16 / RX</text><polyline points="250,192 466,192 466,246 250,246" fill="none" stroke="#111" stroke-width="3"/><text x="290" y="222" font-size="16">Jumper</text><rect x="36" y="325" width="490" height="280" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="56" y="363" font-size="24">SPI / 1 MHz / mode 0</text><text x="56" y="411" font-size="20">GPIO23 / MOSI</text><text x="56" y="465" font-size="20">GPIO19 / MISO</text><polyline points="260,405 466,405 466,459 260,459" fill="none" stroke="#111" stroke-width="3"/><text x="290" y="435" font-size="16">Jumper</text><text x="56" y="525" font-size="18">GPIO14 / SCK: no external wire</text><text x="56" y="566" font-size="18">GPIO4 / CS: no external wire</text><rect x="560" y="115" width="604" height="490" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="582" y="154" font-size="24">I2C / Wire / OLED</text><rect x="582" y="190" width="208" height="330" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2"/><rect x="935" y="190" width="205" height="330" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2"/><text x="602" y="226" font-size="23">ESP32</text><text x="955" y="226" font-size="23">OLED</text><text x="598" y="285" font-size="19">3V3</text><text x="952" y="285" font-size="19">VCC</text><polyline points="790,278 935,278" fill="none" stroke="#111" stroke-width="3"/><text x="598" y="350" font-size="19">GND</text><text x="952" y="350" font-size="19">GND</text><polyline points="790,343 935,343" fill="none" stroke="#111" stroke-width="3"/><text x="598" y="415" font-size="19">GPIO21 / SDA</text><text x="952" y="415" font-size="19">SDA</text><polyline points="790,408 935,408" fill="none" stroke="#111" stroke-width="3"/><text x="598" y="480" font-size="19">GPIO22 / SCL</text><text x="952" y="480" font-size="19">SCL</text><polyline points="790,473 935,473" fill="none" stroke="#111" stroke-width="3"/><text x="582" y="564" font-size="17">Follow printed module labels, not assumed pin order.</text><text x="36" y="641" font-size="18">CS and SCK are configured in software; only MOSI and MISO are jumpered for SPI loopback.</text></g></svg>